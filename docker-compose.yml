services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: siem
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: siemdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siem -d siemdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/siemdb
      SPRING_DATASOURCE_USERNAME: siem
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SIEM_API_KEY: ${SIEM_API_KEY:?defina SIEM_API_KEY no .env}
    ports:
      - "8080:8080"
    restart: on-failure

volumes:
  pgdata:
